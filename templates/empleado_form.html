{% extends "base.html" %}
{% block title %}{{ 'Editar' if e.id else 'Nuevo' }} empleado{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Editar empleado' if e.id else 'Nuevo empleado' }}</h1>
<div class="card" style="max-width: 720px">
  <div class="card-body">
    <form method="post" class="row g-3">
      <div class="col-md-4">
        <label class="form-label" for="cedula">Cédula</label>
        <input class="form-control" id="cedula" name="cedula" maxlength="10" inputmode="numeric" required value="{{ e.cedula or '' }}">
      </div>
      <div class="col-md-8">
        <label class="form-label" for="nombres">Nombres completos</label>
        <input class="form-control" id="nombres" name="nombres" required value="{{ e.nombres or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="cargo">Cargo</label>
        <input class="form-control" id="cargo" name="cargo" required value="{{ e.cargo or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="tipo_contrato">Tipo de contrato</label>
        <select class="form-select" id="tipo_contrato" name="tipo_contrato">
          {% for c in CONTRATOS %}<option {{ 'selected' if e.tipo_contrato == c }}>{{ c }}</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="sueldo_base">Sueldo base (USD)</label>
        <input class="form-control" id="sueldo_base" name="sueldo_base" type="number" step="0.01" min="0.01" required value="{{ e.sueldo_base or '' }}">
        <div class="form-text">SBU 2026: $482.00</div>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="fecha_ingreso">Fecha de ingreso</label>
        <input class="form-control" id="fecha_ingreso" name="fecha_ingreso" type="date" required value="{{ e.fecha_ingreso or '' }}">
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary">Guardar</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('empleados') }}">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
