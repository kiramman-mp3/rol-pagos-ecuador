<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rol de pagos{% endblock %} | Rol de pagos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="barra">
    <div class="barra-interior">
      <a class="marca" href="{{ url_for('inicio') }}">Rol de pagos<small>Ecuador 2026</small></a>
      <nav class="navegacion" aria-label="Principal">
        <a href="{{ url_for('empleados') }}"
           {% if request.endpoint and request.endpoint.startswith('empleado') %}aria-current="page"{% endif %}>Empleados</a>
        <a href="{{ url_for('roles.lista') }}"
           {% if request.blueprint == 'roles' %}aria-current="page"{% endif %}>Roles de pago</a>
      </nav>
      <span class="empresa">{{ EMPRESA.nombre }}</span>
    </div>
  </header>

  <main class="pagina">
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
      <div class="aviso aviso-{{ categoria }} no-imprimir" role="status">{{ mensaje }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
